services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 with pgvector extension
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: icx_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-icx_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-icx_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-icx_command_center}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-icx_user} -d $${POSTGRES_DB:-icx_command_center}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - icx_network

  # ---------------------------------------------------------------------------
  # Redis 7 Cache & Task State Store
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: icx_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - icx_network

  # ---------------------------------------------------------------------------
  # Temporal Server for Durable Workflows & SLA Timers
  # ---------------------------------------------------------------------------
  temporal:
    image: temporalio/auto-setup:1.24.0
    container_name: icx_temporal
    restart: unless-stopped
    environment:
      - DB=postgresql
      - POSTGRES_USER=${POSTGRES_USER:-icx_user}
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-icx_secure_password_2026}
      - POSTGRES_SEEDS=postgres
      - DB_PORT=5432
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - icx_network

  # ---------------------------------------------------------------------------
  # Temporal Web UI Console
  # ---------------------------------------------------------------------------
  temporal-ui:
    image: temporalio/ui:2.26.0
    container_name: icx_temporal_ui
    restart: unless-stopped
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8088
    ports:
      - "8088:8088"
    depends_on:
      - temporal
    networks:
      - icx_network

  # ---------------------------------------------------------------------------
  # FastAPI Modular Monolith Backend
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: icx_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-icx_user}:${POSTGRES_PASSWORD:-icx_secure_password_2026}@postgres:5432/${POSTGRES_DB:-icx_command_center}
      REDIS_URL: redis://redis:6379/0
      TEMPORAL_HOST: temporal:7233
      SECRET_KEY: ${SECRET_KEY:-icx_super_secret_jwt_key_for_production_2026}
      ACCESS_TOKEN_EXPIRE_MINUTES: 720
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - icx_network

  # ---------------------------------------------------------------------------
  # SvelteKit + Svelte 5 Web Application
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: icx_web
    restart: unless-stopped
    environment:
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000/api/v1}
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - icx_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  icx_network:
    driver: bridge
